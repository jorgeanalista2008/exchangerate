name: exchangerate
description: "A new Flutter project."

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.0
  intl: ^0.19.0 # <--- AGREGAR ESTO
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1  # Agrega esta línea

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/sflogo.png"
  
  # Android adaptive icon (Android 8+)
  adaptive_icon_background: "#FFFFFF"          # Fondo blanco
  adaptive_icon_foreground: "assets/icons/sflogo.png"  # Tu logo
  adaptive_icon_foreground_inset: 25           # Margen del logo (% del espacio)
  
                       # Elimina fondo transparente
  
  # Web
  web:
    generate: true
    image_path: "assets/icons/sflogo.png"
    background_color: "#FFFFFF"
    theme_color: "#009688"
  
  # Windows
  windows:
    generate: true
    image_path: "assets/icons/sflogo.png"
    icon_size: 48
  
  # macOS
  macos:
    generate: true
    image_path: "assets/icons/sflogo.png"
